<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>انتخاب پلن</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #F6F1EC);
    --text: var(--tg-theme-text-color, #241E1A);
    --hint: var(--tg-theme-hint-color, #9C8F84);
    --accent: var(--tg-theme-button-color, #C9622D);
    --accent-text: var(--tg-theme-button-text-color, #FFFFFF);
    --card: var(--tg-theme-secondary-bg-color, #FFFFFF);
    --line: #E7DED4;

    --plan-blue: #2E7CE0;
    --plan-blue-dark: #2668C4;
    --plan-green: #33A852;
    --plan-green-dark: #2C9146;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Vazirmatn', system-ui, sans-serif; min-height:100vh;}
  .wrap{max-width:520px; margin:0 auto; padding:18px 18px 100px;}

  .eyebrow{font-size:13px; color:var(--hint); letter-spacing:.02em; margin:0 0 4px;}
  h1{font-size:26px; font-weight:900; margin:0 0 18px; line-height:1.3;}
  .accent-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-inline-start:6px;}

  .summary{display:flex; gap:10px; margin-bottom:20px;}
  .stat{flex:1; background:var(--card); border-radius:16px; padding:14px; border:1px solid var(--line);}
  .stat .num{font-size:18px; font-weight:900; word-break:break-word;}
  .stat .lbl{font-size:12px; color:var(--hint); margin-top:2px;}

  /* Plan dropdown */
  .plan-picker{position:relative; margin-bottom:16px;}
  .plan-trigger{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; border-radius:16px; border:1px solid var(--line);
    background:var(--card); color:var(--text); font-family:inherit; font-size:15px; font-weight:700;
    cursor:pointer;
  }
  .plan-trigger .placeholder{color:var(--hint); font-weight:500;}
  .plan-trigger .chevron{flex:none; transition:transform .18s ease; color:var(--hint);}
  .plan-trigger.open .chevron{transform:rotate(180deg);}
  .plan-trigger-left{display:flex; align-items:center; gap:10px; overflow:hidden;}
  .plan-trigger-icon{flex:none; font-size:18px; line-height:1;}

  .plan-list{
    list-style:none; margin:10px 0 0; padding:0;
    display:flex; flex-direction:column; gap:10px;
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .25s ease, opacity .2s ease;
  }
  .plan-list.open{max-height:600px; opacity:1;}

  .plan-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 18px; border-radius:16px; border:none; cursor:pointer;
    font-family:inherit; text-align:right; width:100%;
    color:#fff; background:var(--plan-blue);
    box-shadow:0 2px 0 rgba(0,0,0,.08) inset;
  }
  .plan-item:active{filter:brightness(.95);}
  .plan-item.trial{background:var(--plan-green);}
  .plan-item.selected{outline:2px solid var(--text); outline-offset:2px;}

  .plan-item .plan-label{font-size:15px; font-weight:700; line-height:1.5;}
  .plan-item .plan-icon{flex:none; font-size:19px; line-height:1;}

  .selected-summary{
    margin-top:14px; padding:14px 16px; border-radius:16px;
    background:var(--card); border:1px solid var(--line); font-size:14px; display:none;
  }
  .selected-summary.show{display:block;}
  .selected-summary b{font-weight:900;}

  .footer-note{margin-top:24px; text-align:center; font-size:12px; color:var(--hint); line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow" id="greeting">پلن‌های اینترنت</p>
  <h1>پلن‌های آماده<span class="accent-dot"></span></h1>

  <div class="summary">
    <div class="stat"><div class="num" id="planCount">5</div><div class="lbl">پلن فعال</div></div>
    <div class="stat"><div class="num" id="cheapestPrice">۲۵٬۰۰۰</div><div class="lbl">ارزان‌ترین (تومان)</div></div>
  </div>

  <div class="plan-picker">
    <button class="plan-trigger" id="planTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="plan-trigger-left">
        <span class="plan-trigger-icon" id="triggerIcon"></span>
        <span id="triggerText" class="placeholder">انتخاب پلن</span>
      </span>
      <span class="chevron" id="chevronIcon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>

    <ul class="plan-list" id="planList" role="listbox"></ul>
  </div>

  <div class="selected-summary" id="selectedSummary"></div>

  <p class="footer-note">پلن مورد نظرت رو انتخاب کن، بعد از دکمه پایین صفحه ادامه بده.</p>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const greetingEl = document.getElementById('greeting');
  const user = tg?.initDataUnsafe?.user;
  if (user?.first_name) {
    greetingEl.textContent = `سلام ${user.first_name} 👋`;
  }

  const plans = [
    { id: 'trial',    label: 'پلن تستی - 1 گیگ 2 روزه - ۲۵٬۰۰۰ تومان',      icon: '➕', price: 25000,  cls: 'trial' },
    { id: 'starter',  label: 'پلن استارتر - 5 گیگ 30 روزه - ۷۹٬۰۰۰ تومان',   icon: '🔒', price: 79000,  cls: '' },
    { id: 'popular',  label: 'پلن پرطرفدار - 10 گیگ 30 روزه - ۱۳۰٬۰۰۰ تومان', icon: '👑', price: 130000, cls: '' },
    { id: 'best',     label: 'پلن پرفروش - 15 گیگ 30 روزه - ۱۸۰٬۰۰۰ تومان',  icon: '✨', price: 180000, cls: '' },
    { id: 'gold',     label: 'پلن طلایی - 30 گیگ 30 روزه - ۳۳۰٬۰۰۰ تومان',   icon: '⭐', price: 330000, cls: '' }
  ];

  document.getElementById('planCount').textContent = plans.length;

  const triggerEl = document.getElementById('planTrigger');
  const triggerTextEl = document.getElementById('triggerText');
  const triggerIconEl = document.getElementById('triggerIcon');
  const listEl = document.getElementById('planList');
  const summaryEl = document.getElementById('selectedSummary');

  let selectedPlan = null;
  let open = false;

  function renderList() {
    listEl.innerHTML = '';
    plans.forEach((plan) => {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `plan-item ${plan.cls} ${selectedPlan?.id === plan.id ? 'selected' : ''}`;
      btn.dataset.id = plan.id;
      btn.innerHTML = `
        <span class="plan-icon">${plan.icon}</span>
        <span class="plan-label">${plan.label}</span>
      `;
      btn.addEventListener('click', () => selectPlan(plan));
      li.appendChild(btn);
      listEl.appendChild(li);
    });
  }

  function toggleList(forceOpen) {
    open = typeof forceOpen === 'boolean' ? forceOpen : !open;
    listEl.classList.toggle('open', open);
    triggerEl.classList.toggle('open', open);
    triggerEl.setAttribute('aria-expanded', String(open));
  }

  function selectPlan(plan) {
    selectedPlan = plan;
    triggerTextEl.textContent = plan.label;
    triggerTextEl.classList.remove('placeholder');
    triggerIconEl.textContent = plan.icon;
    tg?.HapticFeedback?.selectionChanged();

    summaryEl.classList.add('show');
    summaryEl.innerHTML = `پلن انتخابی شما: <b>${plan.label}</b>`;

    renderList();
    toggleList(false);
    updateMainButton();
  }

  function updateMainButton() {
    if (!tg) return;
    if (selectedPlan) {
      tg.MainButton.setText(`ادامه با ${selectedPlan.label.split(' - ')[0]}`);
      tg.MainButton.show();
    } else {
      tg.MainButton.hide();
    }
  }

  triggerEl.addEventListener('click', () => toggleList());

  document.addEventListener('click', (e) => {
    if (open && !e.target.closest('.plan-picker')) {
      toggleList(false);
    }
  });

  if (tg) {
    tg.MainButton.onClick(() => {
      tg.HapticFeedback.notificationOccurred('success');
      tg.close();
    });
  }

  renderList();
</script>
</body>
</html>
