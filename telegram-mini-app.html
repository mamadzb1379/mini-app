<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کارهای امروز</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #F6F1EC);
    --text: var(--tg-theme-text-color, #241E1A);
    --hint: var(--tg-theme-hint-color, #9C8F84);
    --accent: var(--tg-theme-button-color, #C9622D);
    --accent-text: var(--tg-theme-button-text-color, #FFFFFF);
    --card: var(--tg-theme-secondary-bg-color, #FFFFFF);
    --line: #E7DED4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Vazirmatn', system-ui, sans-serif; min-height:100vh;}
  .wrap{max-width:520px; margin:0 auto; padding:18px 18px 100px;}

  .eyebrow{font-size:13px; color:var(--hint); letter-spacing:.02em; margin:0 0 4px;}
  h1{font-size:26px; font-weight:900; margin:0 0 18px; line-height:1.3;}
  .accent-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-inline-start:6px;}

  .summary{display:flex; gap:10px; margin-bottom:20px;}
  .stat{flex:1; background:var(--card); border-radius:16px; padding:14px; border:1px solid var(--line);}
  .stat .num{font-size:22px; font-weight:900;}
  .stat .lbl{font-size:12px; color:var(--hint); margin-top:2px;}

  .add-row{display:flex; gap:8px; margin-bottom:16px;}
  .add-row input{flex:1; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--text); font-family:inherit; font-size:15px;}
  .add-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .add-row button{background:var(--accent); color:var(--accent-text); border:none; border-radius:14px; padding:0 18px; font-family:inherit; font-weight:700; font-size:15px; cursor:pointer;}

  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  li{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
  .check{width:22px; height:22px; border-radius:7px; border:2px solid var(--hint); flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s;}
  .check.done{background:var(--accent); border-color:var(--accent);}
  .check svg{width:13px; height:13px; opacity:0; transition:.15s;}
  .check.done svg{opacity:1;}
  .task-text{flex:1; font-size:15px; cursor:text; word-break:break-word;}
  .task-text.done{color:var(--hint); text-decoration:line-through;}
  .task-edit-input{flex:1; font-size:15px; font-family:inherit; border:1px solid var(--accent); border-radius:8px; padding:6px 8px; background:var(--bg); color:var(--text);}
  .icon-btn{color:var(--hint); background:none; border:none; font-size:16px; cursor:pointer; padding:4px; flex:none; line-height:1;}
  .icon-btn.edit{font-size:15px;}

  .empty{text-align:center; color:var(--hint); font-size:14px; padding:30px 0;}
  .sync-note{text-align:center; color:var(--hint); font-size:11px; margin:-8px 0 16px;}

  .footer-note{margin-top:24px; text-align:center; font-size:12px; color:var(--hint); line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow" id="greeting">کارهای امروز</p>
  <h1>لیست ساده<span class="accent-dot"></span></h1>

  <div class="summary">
    <div class="stat"><div class="num" id="doneCount">0</div><div class="lbl">انجام‌شده</div></div>
    <div class="stat"><div class="num" id="pendingCount">0</div><div class="lbl">باقی‌مانده</div></div>
  </div>

  <div class="add-row">
    <input id="taskInput" type="text" placeholder="یه کار جدید بنویس…">
    <button id="addBtn">افزودن</button>
  </div>

  <p class="sync-note" id="syncNote"></p>

  <ul id="taskList"></ul>
  <div class="empty" id="emptyState">هنوز کاری اضافه نکردی</div>

  <p class="footer-note">این یه نمونه‌ی مینی‌اپ تلگرامه — کارها روی حساب تلگرام خودت ذخیره میشن.</p>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // Greeting using Telegram user data if available
  const greetingEl = document.getElementById('greeting');
  const user = tg?.initDataUnsafe?.user;
  if (user?.first_name) {
    greetingEl.textContent = `سلام ${user.first_name} 👋`;
  }

  const STORAGE_KEY = 'todo_tasks_v1';
  const hasCloudStorage = !!(tg && tg.CloudStorage);
  const syncNoteEl = document.getElementById('syncNote');
  syncNoteEl.textContent = hasCloudStorage
    ? 'ذخیره‌سازی: حساب تلگرام شما'
    : 'ذخیره‌سازی: همین مرورگر';

  let tasks = [];
  let nextId = 1;

  function saveTasks() {
    const payload = JSON.stringify({ tasks, nextId });
    if (hasCloudStorage) {
      tg.CloudStorage.setItem(STORAGE_KEY, payload, (err) => {
        if (err) console.error('CloudStorage save error:', err);
      });
    } else {
      try { localStorage.setItem(STORAGE_KEY, payload); } catch (e) { console.error(e); }
    }
  }

  function loadTasks(callback) {
    if (hasCloudStorage) {
      tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
        if (err) { console.error('CloudStorage load error:', err); callback(null); return; }
        callback(value || null);
      });
    } else {
      let value = null;
      try { value = localStorage.getItem(STORAGE_KEY); } catch (e) { console.error(e); }
      callback(value);
    }
  }

  function seedDefaults() {
    tasks = [
      { id: nextId++, text: 'اپ رو روی تلگرام تست کن', done: false },
      { id: nextId++, text: 'یه کار به لیست اضافه کن', done: false }
    ];
  }

  const listEl = document.getElementById('taskList');
  const emptyEl = document.getElementById('emptyState');
  const doneCountEl = document.getElementById('doneCount');
  const pendingCountEl = document.getElementById('pendingCount');
  const input = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');

  function render() {
    listEl.innerHTML = '';
    emptyEl.style.display = tasks.length ? 'none' : 'block';

    tasks.forEach((task) => {
      const li = document.createElement('li');
      li.dataset.id = task.id;
      li.innerHTML = `
        <div class="check ${task.done ? 'done' : ''}" data-action="toggle">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="task-text ${task.done ? 'done' : ''}" data-action="edit">${escapeHtml(task.text)}</span>
        <button class="icon-btn edit" data-action="edit" title="ویرایش">✎</button>
        <button class="icon-btn" data-action="delete" title="حذف">✕</button>
      `;
      listEl.appendChild(li);
    });

    const doneN = tasks.filter(t => t.done).length;
    doneCountEl.textContent = doneN;
    pendingCountEl.textContent = tasks.length - doneN;

    updateMainButton();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function updateMainButton() {
    if (!tg) return;
    const pending = tasks.filter(t => !t.done).length;
    if (pending === 0 && tasks.length > 0) {
      tg.MainButton.setText('همه انجام شد 🎉');
      tg.MainButton.show();
    } else if (tasks.length > 0) {
      tg.MainButton.setText(`${pending} کار باقی مونده`);
      tg.MainButton.show();
    } else {
      tg.MainButton.hide();
    }
  }

  function findTask(id) {
    return tasks.find(t => t.id === id);
  }

  function startEdit(li, task) {
    const span = li.querySelector('.task-text');
    if (!span) return;
    const editInput = document.createElement('input');
    editInput.className = 'task-edit-input';
    editInput.type = 'text';
    editInput.value = task.text;
    span.replaceWith(editInput);
    editInput.focus();
    editInput.setSelectionRange(editInput.value.length, editInput.value.length);

    function commit() {
      const val = editInput.value.trim();
      if (val) {
        task.text = val;
        saveTasks();
      }
      render();
    }

    editInput.addEventListener('blur', commit);
    editInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') editInput.blur();
      if (e.key === 'Escape') { render(); }
    });
  }

  listEl.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li) return;
    const id = Number(li.dataset.id);
    const task = findTask(id);
    if (!task) return;
    const action = e.target.closest('[data-action]')?.dataset.action;

    if (action === 'toggle') {
      task.done = !task.done;
      tg?.HapticFeedback?.impactOccurred('light');
      saveTasks();
      render();
    } else if (action === 'delete') {
      tasks = tasks.filter(t => t.id !== id);
      tg?.HapticFeedback?.impactOccurred('medium');
      saveTasks();
      render();
    } else if (action === 'edit') {
      startEdit(li, task);
    }
  });

  function addTask() {
    const val = input.value.trim();
    if (!val) return;
    tasks.push({ id: nextId++, text: val, done: false });
    input.value = '';
    tg?.HapticFeedback?.notificationOccurred('success');
    saveTasks();
    render();
  }

  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

  if (tg) {
    tg.MainButton.onClick(() => {
      tg.HapticFeedback.notificationOccurred('success');
      tg.close();
    });
  }

  // Initial load
  loadTasks((raw) => {
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        tasks = parsed.tasks || [];
        nextId = parsed.nextId || (tasks.reduce((m, t) => Math.max(m, t.id), 0) + 1);
      } catch (e) {
        seedDefaults();
      }
    } else {
      seedDefaults();
      saveTasks();
    }
    render();
  });
</script>
</body>
</html>
